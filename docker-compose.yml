services:
  web:
    image: nginx:latest
    # build:
    #   context: .
    #   dockerfile: dockerfile
    container_name: reycrm
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html:rw
      - ./logs:/var/www/html/logs:rw
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - db
      - php
    networks:
      - reycrm-network
  php:
    image: php:8.3-fpm  
    container_name: php
    restart: always
    volumes:
      - .:/var/www/html
    command: > 
      bash -c "chown -R www-data:www-data /var/www/html 
      && docker-php-ext-install pdo pdo_mysql mysqli 
      && php-fpm"
    networks:
      - reycrm-network
  db:
    image: mariadb:latest
    container_name: db
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=$DATABASENAME
      - MYSQL_USER=$DATABASEUSER
      - MYSQL_PASSWORD=$DATABASEPASS
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - reycrm-network
networks:
  reycrm-network:
    driver: bridge
volumes:
  mysql_data:
  reycrm:
